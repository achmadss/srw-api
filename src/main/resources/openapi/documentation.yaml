        - bearerAuth: []
    delete:
      tags:
        - admin
      summary: Delete trash type
      description: Delete a trash type. Requires admin authentication.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Trash type name
      responses:
        '200':
          description: Trash type deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '404':
          description: Trash type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
      security:
        - bearerAuth: []
  /admin/submissions:
    get:
      tags:
        - admin
      summary: Get all submissions (Admin)
      description: Retrieve a paginated list of all submissions. Requires admin authentication.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of items per page
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SubmissionStatus'
          description: Filter submissions by status
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaginatedSubmissionsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '403':
          description: Forbidden
          content:
