components:
  schemas:
    BasicAuthRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    NfcAuthRequest:
      type: object
      required:
        - nfc
      properties:
        nfc:
          type: string
    RefreshTokenAuthRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
    CreateClientRequest:
      type: object
      required:
        - nfc
        - name
        - address
      properties:
        nfc:
          type: string
        name:
          type: string
        address:
          type: string
    UpdateClientRequest:
      type: object
      properties:
        name:
          type: string
        nfc:
          type: string
        address:
          type: string
    ClientResponse:
      type: object
      required:
        - nfc
        - name
        - address
        - totalPoints
      properties:
        nfc:
          type: string
        name:
          type: string
        address:
          type: string
        totalPoints:
          type: integer
          default: 0
    PaginatedClientsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClientResponse'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    PointResponse:
      type: object
      required:
        - id
        - amount
        - createdAt
      properties:
        id:
          type: integer
        amount:
          type: integer
        createdAt:
          type: string
          format: date-time
        submissionId:
          type: integer
          nullable: true
    PaginatedPointLedgerResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PointResponse'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    CreateAgentRequest:
      type: object
      required:
        - name
        - username
        - password
      properties:
        name:
          type: string
        username:
          type: string
        password:
          type: string
    UpdateAgentRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
    AgentResponse:
      type: object
      required:
        - id
        - name
        - username
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaginatedAgentsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentResponse'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    CreateTrashRequest:
      type: object
      required:
        - name
        - pointsPerUnit
      properties:
        name:
          type: string
        pointsPerUnit:
          type: integer
    UpdateTrashRequest:
      type: object
      properties:
        pointsPerUnit:
          type: integer
          nullable: true
    TrashResponse:
      type: object
      required:
        - name
        - pointsPerUnit
        - createdAt
        - updatedAt
      properties:
        name:
          type: string
        pointsPerUnit:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SubmissionStatus:
      type: string
      enum:
        - PENDING
        - ML_PROCESSING
        - AWAITING_REVIEW
        - APPROVED
        - REJECTED
        - ASSIGNED
        - PICKED_UP
        - COMPLETED
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    PaginatedSubmissionsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionDetailResponse'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    ReviewSubmissionRequest:
      type: object
      properties:
        approved:
          type: boolean
        rejectionReason:
          type: string
          nullable: true
        adminNotes:
          type: string
          nullable: true
    AssignAgentRequest:
      type: object
      properties:
        agentId:
          type: integer
    ConfirmPickupRequest:
      type: object
      properties:
        notes:
          type: string
          nullable: true
    ClaimPointsRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: integer
          description: Amount of points to claim (positive integer)
    SubmissionDetailResponse:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: string
        clientNfc:
          type: string
        agentId:
          type: integer
          nullable: true
        agentName:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        rejectionReason:
          type: string
          nullable: true
        adminNotes:
          type: string
          nullable: true
        pickupLocation:
          type: string
          nullable: true
        totalPoints:
          type: integer
          nullable: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionImageResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        assignedAt:
          type: string
          format: date-time
          nullable: true
        pickedUpAt:
          type: string
          format: date-time
          nullable: true
    SubmissionImageResponse:
      type: object
      properties:
        id:
          type: string
          description: Image ID (object key in MinIO storage)
        url:
          type: string
          description: Presigned URL for accessing the image. Expires after 7 days. Generate a new URL by calling the API again to get a fresh presigned URL.
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/ImageMetadataResponse'
        createdAt:
          type: string
          format: date-time
    ImageMetadataResponse:
      type: object
      properties:
        id:
          type: integer
        trashType:
          type: string
        amount:
          type: integer
        points:
          type: integer
    SubmissionHistoryResponse:
      type: object
      properties:
        id:
          type: integer
        oldStatus:
          type: string
        newStatus:
          type: string
        changedBy:
          type: integer
        userType:
          type: string
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    MLStatusResponse:
      type: object
      properties:
        submissionId:
          type: integer
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        totalImages:
          type: integer
        processedImages:
          type: integer
        failedImages:
          type: integer
        images:
          type: array
          items:
            $ref: '#/components/schemas/MLImageStatus'
    MLImageStatus:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        error:
          type: string
          nullable: true
    ManualMetadataRequest:
      type: object
      properties:
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/ManualMetadataItem'
    ManualMetadataItem:
      type: object
      properties:
        trashType:
          type: string
        amount:
          type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  security:
    - bearerAuth: []