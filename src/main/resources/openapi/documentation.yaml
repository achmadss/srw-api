      security:
        - bearerAuth: []
  /agents/submissions:
    get:
      tags:
        - agent
      summary: Get agent submissions
      description: Retrieve a paginated list of submissions assigned to the authenticated agent. Requires agent authentication.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of items per page
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaginatedSubmissionsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
      security:
        - bearerAuth: []
  /agents/submissions/{id}:
    get:
      tags:
        - agent
      summary: Get agent submission details
      description: Retrieve detailed information about a specific submission if it is assigned to the authenticated agent. Requires agent authentication.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Submission ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubmissionDetailResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '403':
          description: Forbidden - submission not assigned to you
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
      security:
        - bearerAuth: []
  /admin/agents/{id}:
    get:
      tags:
        - admin
      summary: Get agent details
      description: Retrieve detailed information about a specific agent. Requires admin authentication.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Agent ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
