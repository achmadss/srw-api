        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
      security:
        - bearerAuth: []
  /admin/trash/{name}:
    get:
      tags:
        - admin
      summary: Get trash type by name
      description: Retrieve information about a specific trash type by name. Requires admin authentication.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Trash type name
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TrashResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '404':
          description: Trash type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
      security:
        - bearerAuth: []
    put:
      tags:
        - admin
      summary: Update trash type
      description: Update trash type points per unit. Requires admin authentication.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Trash type name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrashRequest'
      responses:
        '200':
          description: Trash type updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TrashResponse'
        '400':
          description: Bad request - invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '404':
          description: Trash type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
