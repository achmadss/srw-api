        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
      security:
        - bearerAuth: []
  /admin/points/{clientId}:
    get:
      tags:
        - admin
      summary: Get client points ledger
      description: Retrieve a paginated list of points transactions for a specific client. Requires admin authentication.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
          description: Client ID
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of items per page
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaginatedPointLedgerResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
      security:
        - bearerAuth: []
  /admin/points/{clientId}/claim:
    post:
      tags:
        - admin
      summary: Claim points for client
      description: Deduct points from a client's balance (for redemption). Requires admin authentication.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
          description: Client ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimPointsRequest'
      responses:
        '201':
          description: Points claimed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
